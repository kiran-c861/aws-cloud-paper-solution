<!DOCTYPE html>
<html>
<head>
  <title>Student Registry</title>
</head>
<body>

  <h2>Student Registry</h2>

  <label>Name:</label><br>
  <input id="name" type="text" placeholder="e.g. Kiran" size="30"><br><br>

  <label>Reg No:</label><br>
  <input id="regNo" type="text" placeholder="e.g. 2021CS001" size="30"><br><br>

  <button onclick="createStudent()">Create</button>
  <button onclick="readStudent()">Read</button>
  <button onclick="updateStudent()">Update</button>
  <button onclick="deleteStudent()">Delete</button>

  <br><br>
  <div id="status"></div>

  <script>
    const API_URL = 'https://b62gz776m0.execute-api.ap-south-1.amazonaws.com/prod/my-resource';

    function getName()  { return document.getElementById('name').value.trim(); }
    function getRegNo() { return document.getElementById('regNo').value.trim(); }
    function show(msg)  { document.getElementById('status').innerText = msg; }

    // Parses API Gateway response correctly
    function parse(data) {
      if (data.body) return JSON.parse(data.body);
      return data;
    }

    async function createStudent() {
      if (!getName() || !getRegNo()) return show('Fill both fields!');
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: getName(), regNo: getRegNo() })
      });
      const result = parse(await res.json());
      show(result.message || result);
    }

    async function readStudent() {
      if (!getRegNo()) return show('Enter Reg No!');
      const res = await fetch(`${API_URL}?regNo=${getRegNo()}`);
      const result = parse(await res.json());
      if (res.ok && result.name) {
        show('Name: ' + result.name + ' | Reg No: ' + result.regNo);
        document.getElementById('name').value = result.name;
      } else {
        show(result.message || 'Not found');
      }
    }

    async function updateStudent() {
      if (!getName() || !getRegNo()) return show('Fill both fields!');
      const res = await fetch(API_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: getName(), regNo: getRegNo() })
      });
      const result = parse(await res.json());
      show(result.message || result);
    }

    async function deleteStudent() {
      if (!getRegNo()) return show('Enter Reg No!');
      const res = await fetch(`${API_URL}?regNo=${getRegNo()}`, { method: 'DELETE' });
      const result = parse(await res.json());
      show(result.message || result);
      if (res.ok) {
        document.getElementById('name').value = '';
        document.getElementById('regNo').value = '';
      }
    }
  </script>

</body>
</html>
